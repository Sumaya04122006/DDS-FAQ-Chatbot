    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 14px 36px rgba(0, 0, 0, .35);
  }

  * { box-sizing: border-box; }
  html { scroll-padding-top: 96px; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.6;
    min-height: 100vh;
    transition: background .25s ease, color .25s ease;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  /* ---------------- top bar with circuit traces ---------------- */
  .top {
    position: sticky; top: 0; z-index: 20;
    height: calc(84px + env(safe-area-inset-top, 0px));
    padding-top: env(safe-area-inset-top, 0px);
    background: color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
    overflow: hidden;
  }
  .circuit {
    position: absolute; inset: 0; width: 100%; height: 100%;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 14%, #000 86%, transparent 100%);
            mask-image: linear-gradient(90deg, transparent 0, #000 14%, #000 86%, transparent 100%);
    pointer-events: none;
  }
  .circuit path { fill: none; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
  .circuit .trace { stroke: var(--trace); }
  .circuit .pulse {
    stroke: var(--crimson); stroke-width: 2.4; opacity: 0;
    stroke-dasharray: 9 91; stroke-dashoffset: 100;
    filter: drop-shadow(0 0 4px var(--crimson));
  }
  .circuit circle { fill: var(--paper); stroke: var(--trace); stroke-width: 1.6; }
  body.thinking .circuit .pulse { opacity: 1; animation: run 1.5s linear infinite; }
  body.thinking .circuit .pulse:nth-of-type(2n) { animation-duration: 1.9s; animation-delay: -.6s; }
  body.thinking .circuit .pulse:nth-of-type(3n) { animation-duration: 1.2s; animation-delay: -.3s; }
  @keyframes run { to { stroke-dashoffset: 0; } }

  .top-inner {
    position: relative; height: 84px;
    max-width: 960px; margin: 0 auto; padding: 0 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .plate {
    display: inline-flex; align-items: center; justify-content: center;
    background: #fff; border-radius: 14px; padding: 5px 10px;
    box-shadow: 0 1px 2px rgba(13, 26, 58, .08), 0 6px 16px rgba(13, 26, 58, .1);
    border: 1px solid rgba(13, 26, 58, .06);
  }
  .plate img { height: 56px; width: auto; display: block; }
  .actions { display: flex; align-items: center; gap: 8px; }
  .icon-btn, .ghost-btn {
    background: var(--surface); border: 1px solid var(--line); color: var(--ink);
    border-radius: 12px; height: 40px;
    transition: border-color .15s ease, transform .15s ease, color .15s ease;
  }
  .icon-btn { width: 40px; display: grid; place-items: center; }
  .ghost-btn { padding: 0 16px; font-weight: 500; font-size: .92rem; display: inline-flex; align-items: center; gap: 8px; }
  .ghost-btn svg { display: none; width: 18px; height: 18px; }
  .icon-btn:hover, .ghost-btn:hover { border-color: var(--blue); color: var(--blue); }
  .icon-btn svg { width: 19px; height: 19px; }
  .sun { display: none; }
  [data-theme="dark"] .sun { display: block; }
  [data-theme="dark"] .moon { display: none; }

  /* ---------------- layout ---------------- */
  .wrap { max-width: 820px; margin: 0 auto; padding: 0 20px; }
  main.wrap { padding-bottom: calc(168px + env(safe-area-inset-bottom, 0px)); }

  /* ---------------- hero / empty state ---------------- */
  .hero {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 32px;
    padding: 52px 0 28px;
  }
  .hero h1 {
    font-family: var(--display); font-weight: 800;
    font-size: clamp(2.1rem, 5.6vw, 3.4rem); line-height: 1.04; letter-spacing: -.035em;
    margin: 0 0 14px; max-width: 14ch;
  }
  .hero p { margin: 0; color: var(--muted); font-size: 1.08rem; max-width: 46ch; }
  .hero-logo {
    width: 188px; aspect-ratio: 498 / 400; position: relative; display: grid; place-items: center;
  }
  .hero-logo::before {
    content: ""; position: absolute; inset: -14px; border-radius: 36px;
    background: #fff; border: 1px solid rgba(13, 26, 58, .07); box-shadow: var(--shadow);
  }
  .hero-logo img { position: relative; width: 100%; height: auto; display: block; }

  .asks { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding-bottom: 12px; }
  .ask {
    text-align: left; background: var(--surface); border: 1px solid var(--line);
    border-radius: 16px; padding: 14px 16px; display: grid; gap: 3px;
    transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .ask small { color: var(--crimson); font-weight: 600; font-size: .82rem; }
  .ask span { font-weight: 500; line-height: 1.35; }
  .ask:hover { border-color: var(--blue); transform: translateY(-2px); box-shadow: var(--shadow); }

  /* ---------------- thread ---------------- */
  #thread { display: flex; flex-direction: column; gap: 26px; padding-top: 30px; }
  #thread:empty { display: none; }
  .msg { animation: pop .2s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } }

  .msg.user { align-self: flex-end; max-width: 82%; }
  .msg.user .bubble {
    background: var(--user-bg); color: #fff; padding: 11px 17px;
    border-radius: 20px 20px 6px 20px; white-space: pre-wrap; overflow-wrap: anywhere;
    box-shadow: 0 6px 18px rgba(27, 77, 166, .22);
  }

  .msg.bot { display: grid; grid-template-columns: 34px 1fr; gap: 14px; align-items: start; }
  .avatar {
    width: 34px; height: 34px; border-radius: 11px; background: var(--crimson-soft);
    display: grid; place-items: center; color: var(--crimson);
    font-family: var(--display); font-weight: 800; font-size: .72rem; letter-spacing: .02em;
    border: 1.5px solid var(--crimson);
  }
  .answer {
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px 20px 20px 20px;
    padding: 16px 20px; box-shadow: var(--shadow); min-width: 0;
  }
  .prose > :first-child { margin-top: 0; }
  .prose > :last-child { margin-bottom: 0; }
  .prose p { margin: 0 0 .8em; }
  .prose ul, .prose ol { margin: 0 0 .8em; padding-left: 1.3em; }
  .prose li { margin: .25em 0; }
  .prose strong { font-weight: 600; }
  .prose a { color: var(--blue); text-underline-offset: 3px; }
  .prose code { background: var(--blue-soft); padding: .1em .4em; border-radius: 6px; font-size: .9em; }
  .prose hr { border: none; border-top: 1px solid var(--line); margin: 1em 0; }
  .prose h1, .prose h2, .prose h3 { font-family: var(--display); line-height: 1.2; margin: 1em 0 .4em; }
  .prose h1 { font-size: 1.25rem; } .prose h2 { font-size: 1.15rem; } .prose h3 { font-size: 1.05rem; }
  .prose table { border-collapse: collapse; display: block; overflow-x: auto; margin: 0 0 .8em; }
  .prose th, .prose td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }

  .streaming .prose > :last-child:not(ul):not(ol)::after,
  .streaming .prose > ul:last-child > li:last-child::after,
  .streaming .prose > ol:last-child > li:last-child::after {
    content: ""; display: inline-block; width: 8px; height: 1.05em; margin-left: 3px;
    background: var(--crimson); border-radius: 2px; vertical-align: -.18em;
    animation: blink 1s steps(2, start) infinite;
  }
  @keyframes blink { to { visibility: hidden; } }

  .dots { display: inline-flex; gap: 5px; padding: 6px 0; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--crimson); animation: bounce 1s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .45; } 40% { transform: translateY(-5px); opacity: 1; } }

  .foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; }
  .foot:empty { display: none; }
  .src {
    display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; font-weight: 500;
    background: var(--blue-soft); color: var(--blue); border-radius: 999px; padding: 4px 11px;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .src svg { width: 13px; height: 13px; flex: none; }
  .copy {
    margin-left: auto; background: transparent; border: none; color: var(--muted);
    font-size: .82rem; padding: 4px 8px; border-radius: 8px; display: inline-flex; gap: 6px; align-items: center;
  }
  .copy:hover { color: var(--ink); background: var(--blue-soft); }
  .copy svg { width: 14px; height: 14px; }
  .err { color: var(--crimson); }
  .retry {
    margin-top: 10px; background: var(--crimson); color: #fff; border: none; border-radius: 10px;
    padding: 7px 14px; font-weight: 600; font-size: .88rem;
  }

  /* ---------------- composer ---------------- */
  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
    padding: 28px 20px calc(16px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, var(--paper) 62%, transparent);
  }
  .composer {
    max-width: 780px; margin: 0 auto; display: flex; align-items: flex-end; gap: 10px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 28px;
    padding: 8px 8px 8px 22px; box-shadow: var(--shadow);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .composer:focus-within { border-color: var(--blue); box-shadow: 0 0 0 4px color-mix(in srgb, var(--blue) 18%, transparent), var(--shadow); }
  textarea {
    flex: 1; border: none; outline: none; resize: none; background: transparent; color: var(--ink);
    font: inherit; line-height: 1.5; padding: 9px 0; max-height: 150px; min-height: 28px;
  }
  .composer textarea:focus, .composer textarea:focus-visible { outline: none; box-shadow: none; }
  textarea::placeholder { color: var(--muted); opacity: .8; }
  .send {
    width: 46px; height: 46px; flex: none; border: none; border-radius: 50%;
    background: var(--crimson); color: #fff; display: grid; place-items: center;
    box-shadow: 0 6px 16px color-mix(in srgb, var(--crimson) 38%, transparent);
    transition: transform .15s ease, filter .15s ease;
  }
  .send:hover { transform: scale(1.06); filter: brightness(1.06); }
  .send:disabled { opacity: .4; transform: none; box-shadow: none; cursor: default; }
  .send svg { width: 20px; height: 20px; }
  .send .stop { display: none; }
  body.thinking .send .go { display: none; }
  body.thinking .send .stop { display: block; }
  body.thinking .send:disabled { opacity: 1; cursor: pointer; }
  .note { text-align: center; color: var(--muted); font-size: .78rem; margin: 10px 0 0; }

  @media (max-width: 640px) {
    .hero { grid-template-columns: 1fr; padding-top: 32px; gap: 22px; }
    .hero-logo { display: none; }
    .asks { grid-template-columns: 1fr; }
    .msg.user { max-width: 92%; }
    .msg.bot { grid-template-columns: 1fr; gap: 8px; }
    .avatar { width: 28px; height: 28px; font-size: .62rem; border-radius: 9px; }
    .answer { border-radius: 18px; padding: 14px 16px; }
    .plate img { height: 46px; }
    .ghost-btn span { display: none; }
    .ghost-btn svg { display: block; }
    .ghost-btn { width: 40px; padding: 0; justify-content: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    body.thinking .circuit .pulse { opacity: 0; }
  }
</style>

        var rows = [];
        i += 2;
        while (i < lines.length && lines[i].trim().charAt(0) === "|") {
          rows.push("<tr>" + cells(lines[i]).map(function (c) { return "<td>" + inline(c) + "</td>"; }).join("") + "</tr>");
          i++;
        }
        out.push("<table><thead><tr>" + head + "</tr></thead><tbody>" + rows.join("") + "</tbody></table>"); continue;
      }
      var buf = [];
      while (i < lines.length && !BLANK.test(lines[i]) && !BULLET.test(lines[i]) && !NUMBER.test(lines[i]) && !/^#{1,3}\s/.test(lines[i])) {
        buf.push(inline(lines[i])); i++;
      }
      if (!buf.length) { buf.push(inline(lines[i])); i++; }
      out.push("<p>" + buf.join("<br>") + "</p>");
    }
    return out.join("");
  }
  function nearBottom() {
    return window.innerHeight + window.scrollY >= document.body.scrollHeight - 160;
  }
  function scrollDown() {
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  }
  function setBusy(v) {
    busy = v;
    document.body.classList.toggle("thinking", v);
    sendBtn.disabled = v ? false : input.value.trim() === "";
  }
  function autosize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 150) + "px";
    if (!busy) sendBtn.disabled = input.value.trim() === "";
  }

  /* ---------- message builders ---------- */
  function addUser(text) {
    var el = document.createElement("div");
    el.className = "msg user";
    el.innerHTML = '<div class="bubble"></div>';
    el.firstChild.textContent = text;
    thread.appendChild(el);
    return el;
  }
  var ICON_DOC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>';
  var ICON_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';

  function addBot() {
    var el = document.createElement("div");
    el.className = "msg bot streaming";
    el.innerHTML =
      '<div class="avatar" aria-hidden="true">AI</div>' +
      '<div class="answer"><div class="prose"><span class="dots"><i></i><i></i><i></i></span></div>' +
      '<div class="foot"></div></div>';
    thread.appendChild(el);
    return {
      root: el,
      prose: el.querySelector(".prose"),
      foot: el.querySelector(".foot")
    };
  }

  /* ---------- send ---------- */
  function ask(text) {
    text = (text || "").trim();
    if (!text || busy) return;

    intro.style.display = "none";
    addUser(text);
    var bot = addBot();
    var full = "";
    var failed = false;
    var raf = 0;

    input.value = "";
    autosize();
    setBusy(true);
    scrollDown();

    function paint() {
      raf = 0;
      if (failed) return;
      var stick = nearBottom();
      bot.prose.innerHTML = renderMd(full);
      if (stick) window.scrollTo({ top: document.body.scrollHeight });
    }
    function showError(msg) {
      failed = true;
      bot.prose.innerHTML = '<p class="err">' + esc(msg) + "</p>";
      var b = document.createElement("button");
      b.type = "button"; b.className = "retry"; b.textContent = "Try again";
      b.addEventListener("click", function () {
        bot.root.previousElementSibling && bot.root.previousElementSibling.remove();
        bot.root.remove();
        ask(text);
      });
      bot.prose.appendChild(b);
    }
    function finish() {
      bot.root.classList.remove("streaming");
      setBusy(false);
      controller = null;
      if (!failed && full) {
        history.push({ role: "user", content: text }, { role: "assistant", content: full });
        var copy = document.createElement("button");
        copy.type = "button"; copy.className = "copy";
        copy.innerHTML = ICON_COPY + "<span>Copy</span>";
        copy.addEventListener("click", function () {
          if (navigator.clipboard) navigator.clipboard.writeText(full);
          copy.lastChild.textContent = "Copied";
          setTimeout(function () { copy.lastChild.textContent = "Copy"; }, 1500);
        });
        bot.foot.appendChild(copy);
      }
      input.focus();
    }

    controller = new AbortController();
    fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, history: history.slice(-6) }),
      signal: controller.signal
    }).then(function (res) {
      if (res.status === 429) { showError("You're asking quickly. Please wait a minute and try again."); finish(); return; }
      if (!res.ok || !res.body) { showError("Something went wrong. Please try again."); finish(); return; }

      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var buf = "";

      function handle(evt) {
        if (evt.t === "delta") {
          full += evt.v;
          if (!raf) raf = requestAnimationFrame(paint);
        } else if (evt.t === "sources") {
          evt.v.forEach(function (s) {
            var chip = document.createElement("span");
            chip.className = "src";
            chip.title = s.file;
            chip.innerHTML = ICON_DOC + "<span></span>";
            chip.lastChild.textContent = s.title;
            bot.foot.insertBefore(chip, bot.foot.firstChild);
          });
        } else if (evt.t === "error") {
          showError(evt.v);
        }
      }
      function pump() {
        return reader.read().then(function (r) {
          if (r.done) { if (raf) cancelAnimationFrame(raf); if (!failed) paint(); finish(); return; }
          buf += decoder.decode(r.value, { stream: true });
          var parts = buf.split("\n\n");
          buf = parts.pop();
          parts.forEach(function (p) {
            if (p.indexOf("data: ") === 0) {
              try { handle(JSON.parse(p.slice(6))); } catch (e) {}
            }
          });
          return pump();
        });
      }
      return pump();
    }).catch(function (err) {
      if (err && err.name === "AbortError") {
        if (raf) cancelAnimationFrame(raf);
        if (full) paint(); else bot.root.remove();
        finish();
      } else {
        showError("Can't reach the server. Check your connection and try again.");
        finish();
      }
    });
  }

  /* ---------- events ---------- */
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (busy) { if (controller) controller.abort(); return; }
    ask(input.value);
  });
  input.addEventListener("input", autosize);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      if (!busy) ask(input.value);
    }
  });
  document.querySelectorAll(".ask").forEach(function (b) {
    b.addEventListener("click", function () { ask(b.getAttribute("data-q")); });
  });
  $("#newBtn").addEventListener("click", function () {
    if (controller) controller.abort();
    history = [];
    thread.innerHTML = "";
    intro.style.display = "";
    setBusy(false);
    window.scrollTo({ top: 0, behavior: "smooth" });
    input.focus();
  });
  autosize();
})();
</script>
</body>
</html>
